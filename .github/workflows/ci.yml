name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.lock
      - name: Compile
        run: python -m compileall -q .
      - name: Tests
        run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      - name: Tests
        run: CI=true npm test -- --watchAll=false --runInBand
      - name: Build
        run: npm run build

  governance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Diff hygiene
        run: git diff --check HEAD^ HEAD
      - name: Governance documents and templates
        run: |
          test -s CONTRIBUTING.md
          test -s docs/ARCHITECTURE_REVIEW_CHECKLIST.md
          test -s docs/DEFINITION_OF_DONE.md
          test -s docs/MOTION_PRINCIPLES.md
          test -s .github/PULL_REQUEST_TEMPLATE/default.md
          test -s .github/ISSUE_TEMPLATE/relevant-change.yml
      - name: Conditional infrastructure note
        run: |
          echo "Real MongoDB, external integrations, and full E2E remain conditional gates."
          echo "They must run when the required credentials and infrastructure are configured."
